<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Load PlayinGameCenter from CDN</title>
    <style>
        #playin-game-center-root {
            max-width: 200px;
            max-height: 200px;
            overflow: hidden;
        }

    </style>
</head>
<body>
<div id="container">
    <button data-device="desktop" type="button" class="pre-load">Start Desktop Game in Iframe</button>
    &nbsp;
    <button data-device="mobile" type="button" class="pre-load">Start Mobile Game in Iframe</button>
</div>
<div id="playin-game-center-root" style="width:200px;height:200px;border:1px solid black;"></div>

<!-- Load PlayinGameCenter from CDN -->
<link rel="stylesheet" href="https://ccsqmvifdmwllajsrihc.supabase.co/storage/v1/object/public/playin-game-center/nlc/playin-game-center.css" />

<script>
    const script = document.createElement('script');
    script.src = 'https://ccsqmvifdmwllajsrihc.supabase.co/storage/v1/object/public/playin-game-center/nlc/playin-game-center.js';
    script.onload = () => {
        console.log('PlayinGameCenter loaded:', window.PlayinGameCenter);
        if (window.PlayinGameCenter && typeof window.PlayinGameCenter.init === 'function') {
            const el = document.getElementById('playin-game-center-root');
            window.PlayinGameCenter.init(el);
        } else {
            console.error('PlayinGameCenter not available on window (after script load)');
        }
    };
    script.onerror = () => {
        console.error('Failed to load PlayinGameCenter script');
    };
    document.head.appendChild(script);

</script>

</body>
</html>
